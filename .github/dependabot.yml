version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      uv-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # mcp, starlette and pydantic majors change the server's public
      # behaviour — those upgrades are planned work, not a dependency bump.
      - dependency-name: mcp
        update-types: ["version-update:semver-major"]
      - dependency-name: starlette
        update-types: ["version-update:semver-major"]
      - dependency-name: pydantic
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(docker)"
    groups:
      docker-minor-patch:
        update-types: ["minor", "patch"]
