name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same ref makes the older run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: nothing here needs write access, and no job in this
# workflow may mint an OIDC token. Publishing lives in release.yml.
permissions:
  contents: read

env:
  UV_FROZEN: "1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --all-extras --dev

      # --no-fix: [tool.ruff] sets fix = true for local runs. In CI a lint
      # error must fail, not be silently rewritten into a passing tree.
      - name: ruff check
        run: uv run ruff check --no-fix .

      - name: ruff format --check
        run: uv run ruff format --check .

      # docs/permissions.md is generated from the tool descriptions. A stale
      # copy sends readers to grant the wrong scopes, so it fails the PR.
      - name: permissions doc is current
        run: uv run python scripts/generate_permissions.py --check

      # Tool counts quoted in prose drift silently the first time a tool is
      # added — nothing about adding one has a reason to touch the sentence.
      # Derived from the allowlists, so a stale number fails the PR.
      - name: documented counts are current
        run: uv run python scripts/check_docs.py --check

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - run: uv sync --all-extras --dev --python ${{ matrix.python-version }}

      - name: pytest
        run: uv run --python ${{ matrix.python-version }} pytest -q

  build:
    name: build + wheel smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Build sdist + wheel
        run: uv build

      # The point of the src-layout (ADR 0001) is that a module missing from
      # the wheel fails here rather than after release. Install the built
      # artifact into a clean environment and exercise it — importing the
      # package runs every domain module's @tool registration, and resolving
      # the allowlist proves none of them went missing.
      - name: Install the wheel into a clean venv and exercise it
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          /tmp/smoke/bin/python - <<'PY'
          from ms_graph_mcp.allowlists import (
              resolve_read_tools, resolve_write_tools, resolve_internal_tools,
          )
          # Resolution is the assertion: every allowlisted name must map to a
          # tool registered by the installed wheel, or these raise. Exact counts
          # are deliberately NOT duplicated here — tests/test_allowlists.py owns
          # that guard, and a second copy just means every tranche edits CI too.
          read, write, internal = (
              resolve_read_tools(), resolve_write_tools(), resolve_internal_tools(),
          )
          print(f"read={len(read)} write={len(write)} internal={len(internal)}")
          assert read and write and internal, "a tier resolved empty from the wheel"
          PY

      - name: Verify console scripts are installed
        run: |
          test -x /tmp/smoke/bin/ms-graph-mcp
          test -x /tmp/smoke/bin/ms-graph-mcp-http

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7


  inspector:
    name: MCP Inspector smoke check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # NB: no --locked. setup-uv exports UV_FROZEN=1, which means the same
      # thing and errors if --locked is also passed.
      - run: uv sync

      # Inspector is the reference MCP client, and the point of running it is
      # that it is *not* built on the SDK this server uses. The pytest suite —
      # including the in-process conformance tests — drives the server with the
      # same library it is implemented with, so an SDK-level bug is invisible to
      # it. A third-party client sees what a real user's client would.
      #
      # Variables are passed with -e: Inspector does not hand the server it
      # spawns the parent environment, so exporting them would silently start
      # the server with none of them.
      - name: tools/list through a real client
        run: |
          npx -y @modelcontextprotocol/inspector --cli \
            uv run ms-graph-mcp \
            -e GRAPH_MCP_ACCESS_TOKEN=not-a-real-token \
            -e GRAPH_MCP_TOOLSETS=all \
            --method tools/list > /tmp/tools.json

          python - <<'PYEOF'
          import json, pathlib, sys

          tools = json.loads(pathlib.Path("/tmp/tools.json").read_text())["tools"]
          print(f"{len(tools)} tools advertised")

          missing = [t["name"] for t in tools if not t.get("annotations")]
          if missing:
              sys.exit(f"::error::tools advertised without annotations: {missing[:5]}")

          # A write tool reaching an unprivileged client's tools/list is the
          # tier boundary failing in the one place a user would actually see it.
          leaked = [t["name"] for t in tools if t["name"] == "mail_send"]
          if leaked:
              sys.exit(f"::error::write tools advertised without write scope: {leaked}")

          if len(tools) < 40:
              sys.exit(f"::error::only {len(tools)} tools advertised; expected the full read tier")
          PYEOF

      # A call with no credentials must not reach Graph. Inspector reports a
      # failing tool by exiting non-zero and printing {"error": {"code":
      # "tool_is_error"}} rather than the tool's own result, so the run is
      # allowed to fail and both shapes are accepted — older versions pass the
      # raw CallToolResult straight through. Either one proves the point; what
      # would fail the check is a *successful* call.
      - name: a tool call fails closed without credentials
        run: |
          set +e
          npx -y @modelcontextprotocol/inspector --cli \
            uv run ms-graph-mcp \
            --method tools/call --tool-name people_get_my_profile > /tmp/call.json 2>/dev/null
          set -e

          python - <<'PYEOF'
          import json, pathlib, sys

          raw = pathlib.Path("/tmp/call.json").read_text().strip()
          if not raw:
              sys.exit("::error::no output from the tool call")
          result = json.loads(raw)

          # Inspector's own wrapper for a tool that returned isError.
          if isinstance(result.get("error"), dict):
              code = result["error"].get("code")
              if code != "tool_is_error":
                  sys.exit(f"::error::unexpected client error: {result['error']}")
              print("fails closed: client reported", code)
              raise SystemExit

          if not result.get("isError"):
              sys.exit(f"::error::a call without a token succeeded: {raw[:200]}")

          payload = json.loads(result["content"][0]["text"])
          if payload.get("error") != "missing_graph_token":
              sys.exit(f"::error::unexpected error shape: {payload}")
          print("fails closed:", payload["error"])
          PYEOF

  changelog:
    name: changelog entry
    # Pull requests only: a direct push to main has no PR to annotate, and a
    # release-prep branch rewrites the changelog wholesale by design.
    #
    # The `no-changelog` label is checked here rather than inside the script,
    # because a step that has already failed cannot be rescued by a later one —
    # the job fails regardless of what runs after it.
    if: >-
      github.event_name == 'pull_request'
      && !startsWith(github.head_ref, 'release/')
      && !contains(github.event.pull_request.labels.*.name, 'no-changelog')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A version mismatch is already caught at tag time by release.yml. The gap
      # this closes is the other one: a behaviour change shipping with nothing
      # written down, which nobody notices until someone asks what changed
      # between two releases.
      - name: Require a changelog entry when src/ changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          CHANGED=$(git diff --name-only "$BASE" "$HEAD")
          echo "Files changed:"
          echo "$CHANGED"

          if ! echo "$CHANGED" | grep -q '^src/'; then
            echo "No changes under src/ — nothing to record."
            exit 0
          fi
          if echo "$CHANGED" | grep -q '^CHANGELOG.md$'; then
            echo "src/ changed and CHANGELOG.md was updated."
            exit 0
          fi

          echo "::error::This PR changes src/ but not CHANGELOG.md. Add an entry under '## [Unreleased]', or apply the 'no-changelog' label if it genuinely needs none — a pure refactor, a comment fix."
          exit 1
