name: Release

# Tag-triggered only. Nothing here runs on a push or a pull request.
#
#   git tag v0.2.0-rc1 && git push --tags   → stops after TestPyPI + verify
#   git tag v0.2.0     && git push --tags   → continues to PyPI on approval
#
# Every release goes through TestPyPI first, including real ones:
#
#   build ─→ testpypi ─→ verify ─┬─→ pypi (real tags only, needs approval)
#                                ├─→ ghcr
#                                └─→ github-release
#
# `verify` installs the artifact *back out of TestPyPI* into a clean venv and
# runs it. That is the gate: a package that builds but does not install — a
# missing module, a dependency that does not resolve, a broken console script —
# fails here, before the name is spent on PyPI. A PyPI release cannot be yanked
# and re-uploaded under the same version, so the rehearsal has to be automatic
# rather than something a human remembers to do.
#
# Before the first release the following must exist (see CONTRIBUTING.md):
#   - a PyPI "pending publisher": project ms-graph-mcp, owner nitin27may,
#     repository ms-graph-mcp, workflow release.yml, environment pypi
#   - the SAME on TestPyPI, with environment testpypi. Separate account, and
#     the pipeline stops at the first stage without it.
#   - GitHub Environments named `pypi` and `testpypi`, with a required reviewer
#     on `pypi` so a real publish pauses and an -rc does not.
#
# There is no API token or repository secret anywhere in this file, by design.
# Trusted Publishing exchanges a short-lived GitHub OIDC token for an upload
# credential scoped to this workflow. Signing in to PyPI *with* a GitHub
# account is a different thing entirely and does not enable any of this.

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build distributions
    runs-on: ubuntu-latest
    outputs:
      # The normalized PEP 440 version, so `verify` installs exactly what was
      # published rather than re-deriving it from the tag and guessing wrong.
      version: ${{ steps.version.outputs.version }}
      # Whether this release may go to PyPI at all. See the gate step below.
      publish_to_pypi: ${{ steps.gate.outputs.publish }}
    # Deliberately no id-token permission on this job. The build runs
    # third-party code (build backends, dependencies); if it could mint an
    # OIDC token it could mint a PyPI upload credential. Only the publish
    # jobs below get that permission.
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # The tag and pyproject.toml must agree, or someone forgot the version
      # bump — cheaper to catch here than to discover a release is unyankable.
      #
      # Compared as PEP 440 versions rather than as strings, so the git-tag
      # convention (v0.2.0-rc1) and the Python version it normalizes to
      # (0.2.0rc1) are recognised as the same thing. Comparing strings would
      # either reject that pair or, worse, silently strip the suffix and
      # publish a *stable* 0.2.0 from a tag that said release candidate.
      - name: Verify the tag matches pyproject version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          uv run --no-project --with packaging python - "$TAG" <<'PY' >> "$GITHUB_OUTPUT"
          import pathlib, sys, tomllib
          from packaging.version import InvalidVersion, Version

          tag_raw = sys.argv[1]
          project_raw = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          try:
              tag, project = Version(tag_raw), Version(project_raw)
          except InvalidVersion as exc:
              sys.exit(f"::error::{exc}")
          if tag != project:
              sys.exit(
                  f"::error::Tag {tag_raw} (={tag}) does not match "
                  f"pyproject version {project_raw} (={project})"
              )
          print(f"version={project}")
          PY

      - name: Report the version being released
        run: echo "releasing ${{ steps.version.outputs.version }}"

      # Release candidates belong on PyPI — pip excludes prereleases by
      # default, so `pip install ms-graph-mcp` keeps resolving to the newest
      # stable while anyone who wants the candidate asks for it with `--pre` or
      # an exact pin. That is how numpy, Django and pip itself ship theirs, and
      # it beats sending people to TestPyPI, which is a sandbox for testing the
      # publishing process rather than a distribution channel.
      #
      # With one exception, which this step exists to enforce: that protection
      # only holds once a stable release exists. When a prerelease is the *only*
      # version on the index, pip installs it with no --pre and no pin —
      # verified, not assumed. Publishing a candidate before the first stable
      # release would therefore hand a release candidate to the very first
      # person who typed `pip install ms-graph-mcp`.
      - name: Decide whether this may go to PyPI
        id: gate
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          uv run --no-project --with packaging python - "$VERSION" <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys, urllib.error, urllib.request
          from packaging.version import Version

          version = Version(sys.argv[1])
          if not version.is_prerelease:
              print("publish=true")
              sys.exit()

          try:
              with urllib.request.urlopen(
                  "https://pypi.org/pypi/ms-graph-mcp/json", timeout=30
              ) as response:
                  releases = json.load(response)["releases"]
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
              releases = {}

          # A version with no files is a yanked-empty placeholder, not a release.
          stable = [v for v, files in releases.items() if files and not Version(v).is_prerelease]
          if stable:
              print("publish=true")
          else:
              print("publish=false")
              print(
                  "::notice::Skipping PyPI: no stable release exists yet, and a "
                  "prerelease published as the only version would be installed by "
                  "a plain `pip install`. Ship a stable release first.",
                  file=sys.stderr,
              )
          PY

      - run: uv build

      - name: Install the wheel into a clean venv and exercise it
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          /tmp/smoke/bin/python - <<'PY'
          from ms_graph_mcp.allowlists import (
              resolve_read_tools, resolve_write_tools, resolve_internal_tools,
          )
          read, write, internal = (
              resolve_read_tools(), resolve_write_tools(), resolve_internal_tools(),
          )
          print(f"read={len(read)} write={len(write)} internal={len(internal)}")
          assert read and write and internal
          PY
          test -x /tmp/smoke/bin/ms-graph-mcp
          test -x /tmp/smoke/bin/ms-graph-mcp-http

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  testpypi:
    name: publish to TestPyPI
    # Unconditional. A real tag rehearses on TestPyPI exactly like a candidate
    # does — the whole point is that the path to PyPI has been walked before.
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/ms-graph-mcp
    permissions:
      id-token: write # mandatory for Trusted Publishing
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # Re-running a partially failed release must not die on "file already
          # exists" for an artifact the previous attempt uploaded.
          skip-existing: true

  verify:
    name: install from TestPyPI and run it
    needs: [build, testpypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # TestPyPI's index can lag the upload by a few seconds, so this retries
      # rather than failing the release over CDN propagation.
      #
      # --extra-index-url is mandatory: TestPyPI does not mirror PyPI, so every
      # real dependency (mcp, httpx, pydantic, …) has to resolve from PyPI or
      # the install fails for reasons that have nothing to do with this package.
      - name: Install the published artifact into a clean venv
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          python -m venv /tmp/verify
          for attempt in 1 2 3 4 5; do
            if /tmp/verify/bin/pip install \
                 --index-url https://test.pypi.org/simple/ \
                 --extra-index-url https://pypi.org/simple/ \
                 "ms-graph-mcp==${VERSION}"; then
              echo "installed on attempt ${attempt}"
              exit 0
            fi
            echo "not on the index yet; retrying in 15s"
            sleep 15
          done
          echo "::error::ms-graph-mcp==${VERSION} never became installable from TestPyPI"
          exit 1

      # Proves the *installed* package works, which the build-stage smoke test
      # cannot: it ran against a local wheel, not one that made a round trip
      # through an index and resolved its dependencies from scratch.
      - name: Exercise the installed package
        run: |
          /tmp/verify/bin/python - <<'PY'
          from ms_graph_mcp.allowlists import (
              resolve_read_tools, resolve_write_tools, resolve_internal_tools,
          )
          read, write, internal = (
              resolve_read_tools(), resolve_write_tools(), resolve_internal_tools(),
          )
          print(f"read={len(read)} write={len(write)} internal={len(internal)}")
          assert read and write and internal
          PY
          test -x /tmp/verify/bin/ms-graph-mcp
          test -x /tmp/verify/bin/ms-graph-mcp-http

      # Speaks MCP over stdio and returns a well-formed initialize result —
      # the console script actually runs, rather than merely existing.
      - name: Speak the protocol to it
        run: |
          # 2025-11-25 is LATEST_HANDSHAKE_VERSION: `initialize` is the legacy
          # handshake and cannot negotiate the modern 2026-07-28 revision, which
          # clients reach by another path. Asking for 2026-07-28 here would make
          # a correct reply look like a silent downgrade in the log.
          REQ='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}'
          echo "$REQ" | timeout 30 /tmp/verify/bin/ms-graph-mcp 2>/dev/null \
            | head -1 | python -c 'import json,sys; r=json.load(sys.stdin); assert r["result"]["serverInfo"]["name"]; print("handshake OK:", r["result"]["protocolVersion"])'

      # The safety property the whole pre-release design rests on: a candidate
      # must be invisible to a plain `pip install`, and reachable with --pre.
      #
      # Checked per release against the real index rather than assumed, because
      # it is the assumption the `gate` step acts on, and because it would fail
      # silently if a release were ever mis-versioned — publishing 0.2.0 from an
      # -rc tag would look fine everywhere except here.
      # The safety property the whole pre-release design rests on: a candidate
      # must be invisible to a plain `pip install`, and reachable with --pre.
      #
      # Checked per release against the real index rather than assumed. It is
      # the assumption the `gate` step acts on, and it would fail silently if a
      # release were ever mis-versioned — publishing 0.2.0 from an -rc tag would
      # look correct everywhere except here.
      - name: Check the pre-release flag behaves
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          python -m pip install --quiet packaging

          # Index flags are repeated rather than held in a variable: relying on
          # word-splitting an unquoted "$FLAGS" works in bash and silently does
          # not in zsh, which is a poor thing for a release to depend on.
          resolve() {
            /tmp/verify/bin/pip install --dry-run --no-deps \
              --index-url https://test.pypi.org/simple/ \
              --extra-index-url https://pypi.org/simple/ \
              "$@" ms-graph-mcp 2>/dev/null \
              | grep -oE "ms[-_]graph[-_]mcp-[0-9][^ ]*" | tail -1 \
              | sed "s/^ms[-_]graph[-_]mcp-//"
          }

          PLAIN=$(resolve)
          PRE=$(resolve --pre)
          echo "plain  -> ${PLAIN:-<nothing>}"
          echo "--pre  -> ${PRE:-<nothing>}"

          python - "$VERSION" "$PLAIN" "$PRE" <<'PYEOF'
          import sys
          from packaging.version import Version

          version, plain, pre = (a or None for a in sys.argv[1:4])
          published = Version(version)

          if pre is None:
              sys.exit("::error::--pre resolved nothing; the published artifact is unreachable")

          if not published.is_prerelease:
              print(f"{published} is stable; nothing to assert about --pre.")
              raise SystemExit

          if plain is None:
              print("Nothing resolves without --pre: no stable exists on this index yet.")
              print("That is exactly the case the `gate` step keeps off PyPI.")
              raise SystemExit

          if Version(plain).is_prerelease:
              sys.exit(
                  f"::error::A plain `pip install` selected the pre-release {plain}. "
                  "A candidate must never be what an ordinary user gets."
              )

          print(f"OK: plain install selects {plain}; the candidate {published} needs --pre.")
          PYEOF

  pypi:
    name: publish to PyPI
    # Stable releases always; candidates only once a stable exists to shadow
    # them. Decided in `build`, because a job-level `if` cannot query PyPI.
    if: needs.build.outputs.publish_to_pypi == 'true'
    needs: [build, verify]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ms-graph-mcp
    permissions:
      id-token: write # mandatory for Trusted Publishing
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # Publishes with PEP 740 build provenance attestations, which the
      # action generates from the same OIDC identity by default.
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: create GitHub release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          if [[ "$GITHUB_REF_NAME" == *-rc* ]]; then PRERELEASE="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            $PRERELEASE

  ghcr:
    name: publish container image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # For the build provenance attestation below.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN is scoped to this repository and expires with the job, so
      # GHCR needs no stored credential of its own.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest` only on a real release — an -rc tag must never become the
          # tag people pull by default.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-rc') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-rc') }}

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Lets a consumer verify the image was built by this workflow from this
      # commit, rather than pushed by hand to the same name.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
